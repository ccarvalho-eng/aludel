name: Release Hex Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without the leading v, for example 0.4.2"
        required: true
        type: string

permissions:
  contents: write

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.4.1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release to GitHub and Hex.pm
    runs-on: ubuntu-latest
    environment: hex-publish

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aludel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Elixir
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Wait for Postgres
        run: |
          for attempt in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              exit 0
            fi

            sleep 1
          done

          echo "::error::PostgreSQL did not become ready"
          exit 1

      - name: Validate requested version
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! elixir -e '
            case Version.parse(System.fetch_env!("RELEASE_VERSION")) do
              {:ok, _version} -> :ok
              :error -> System.halt(1)
            end
          '; then
            echo "::error::version must be SemVer without a leading v"
            exit 1
          fi

          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            tag_exists=true
          fi

          release_exists=false
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            release_exists=true
          fi

          hex_status="$(
            curl --silent --show-error --location --retry 3 --retry-all-errors \
              --user-agent "aludel-release-workflow/${GITHUB_RUN_ID}" \
              --output /dev/null --write-out "%{http_code}" \
              "https://hex.pm/api/packages/aludel/releases/${RELEASE_VERSION}"
          )"

          case "$hex_status" in
            200) hex_exists=true ;;
            404) hex_exists=false ;;
            *)
              echo "::error::Hex.pm release lookup returned HTTP ${hex_status}"
              exit 1
              ;;
          esac

          if [ "$release_exists" = "true" ] && [ "$tag_exists" != "true" ]; then
            echo "::error::GitHub release exists without its repository tag"
            exit 1
          fi

          if [ "$hex_exists" = "true" ] && [ "$tag_exists" != "true" ]; then
            echo "::error::Hex.pm release exists without its repository tag"
            exit 1
          fi

          if [ "$tag_exists" = "true" ]; then
            if ! git merge-base --is-ancestor "v${RELEASE_VERSION}" main; then
              echo "::error::release tag is not contained in main"
              exit 1
            fi

            new_release=false
          else
            new_release=true
          fi

          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${release_exists}" >> "$GITHUB_OUTPUT"
          echo "hex_exists=${hex_exists}" >> "$GITHUB_OUTPUT"
          echo "new_release=${new_release}" >> "$GITHUB_OUTPUT"

      - name: Checkout existing release tag
        if: ${{ steps.release_state.outputs.tag_exists == 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git checkout "v${RELEASE_VERSION}"

      - name: Prepare release metadata
        if: ${{ steps.release_state.outputs.new_release == 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          elixir scripts/aludel_release_prep.exs "$RELEASE_VERSION" \
            --notes-file /tmp/aludel-release-notes.md
          mix format mix.exs

      - name: Recover release notes
        if: ${{ steps.release_state.outputs.tag_exists == 'true' && steps.release_state.outputs.release_exists != 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          elixir scripts/aludel_release_prep.exs "$RELEASE_VERSION" \
            --notes-only --notes-file /tmp/aludel-release-notes.md

      - name: Install dependencies
        run: mix deps.get

      - name: Verify release
        env:
          HEX_API_KEY: ${{ secrets.HEX_SECRET_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::error::HEX_SECRET_KEY is not configured"
            exit 1
          fi

          package_version="$(
            elixir -e 'Mix.start(); Code.require_file("mix.exs"); Mix.Project.get!(); IO.write(Mix.Project.config()[:version])'
          )"

          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "::error::requested version ${RELEASE_VERSION} does not match mix.exs version ${package_version}"
            exit 1
          fi

          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate
          mix precommit
          mix deps.audit
          mix hex.audit

          mix hex.publish --dry-run --yes
          mix hex.build --unpack --output /tmp/aludel-hex-package

      - name: Commit release metadata
        if: ${{ steps.release_state.outputs.new_release == 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.exs README.md CHANGELOG.md

          if git diff --cached --quiet; then
            echo "::error::release metadata did not change"
            exit 1
          fi

          git commit \
            -m "chore: release ${RELEASE_VERSION}" \
            -m "Update Aludel package metadata and changelog for ${RELEASE_VERSION}."

      - name: Tag and push release
        if: ${{ steps.release_state.outputs.new_release == 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git tag -a "v${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
          git push --atomic origin HEAD:main "v${RELEASE_VERSION}"

      - name: Create GitHub release
        if: ${{ steps.release_state.outputs.release_exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --notes-file /tmp/aludel-release-notes.md

      - name: Publish package or recover documentation
        env:
          HEX_API_KEY: ${{ secrets.HEX_SECRET_KEY }}
          HEX_RELEASE_EXISTS: ${{ steps.release_state.outputs.hex_exists }}
        run: |
          set -euo pipefail

          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::error::HEX_SECRET_KEY is not configured"
            exit 1
          fi

          if [ "$HEX_RELEASE_EXISTS" = "true" ]; then
            mix hex.publish docs --yes
          else
            mix hex.publish --yes
          fi
