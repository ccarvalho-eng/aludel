name: Release Hex Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without the leading v, for example 0.4.2"
        required: true
        type: string

permissions:
  contents: write

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.4.1"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release to GitHub and Hex.pm
    runs-on: ubuntu-latest
    environment: hex-publish

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aludel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Elixir
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Wait for Postgres
        run: |
          for attempt in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              exit 0
            fi

            sleep 1
          done

          echo "::error::PostgreSQL did not become ready"
          exit 1

      - name: Validate requested version
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! elixir -e '
            case Version.parse(System.fetch_env!("RELEASE_VERSION")) do
              {:ok, _version} -> :ok
              :error -> System.halt(1)
            end
          '; then
            echo "::error::version must be SemVer without a leading v"
            exit 1
          fi

          tag_exists=false
          if git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            tag_exists=true
          fi

          release_exists=false
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "$tag_exists" = "true" ] || [ "$release_exists" = "true" ]; then
            if [ "$tag_exists" = "true" ] && [ "$release_exists" = "true" ]; then
              echo "existing_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::release state is partial: tag_exists=${tag_exists}, release_exists=${release_exists}"
            exit 1
          fi

          echo "existing_release=false" >> "$GITHUB_OUTPUT"

      - name: Checkout existing release tag
        if: ${{ steps.release_state.outputs.existing_release == 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git checkout "v${RELEASE_VERSION}"

      - name: Prepare release metadata
        if: ${{ steps.release_state.outputs.existing_release != 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          elixir scripts/aludel_release_prep.exs "$RELEASE_VERSION" \
            --notes-file /tmp/aludel-release-notes.md
          mix format

      - name: Install dependencies
        run: mix deps.get

      - name: Verify release
        env:
          HEX_API_KEY: ${{ secrets.HEX_SECRET_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXISTING_RELEASE: ${{ steps.release_state.outputs.existing_release }}
        run: |
          set -euo pipefail

          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::error::HEX_SECRET_KEY is not configured"
            exit 1
          fi

          package_version="$(
            elixir -e 'Mix.start(); Code.require_file("mix.exs"); Mix.Project.get!(); IO.write(Mix.Project.config()[:version])'
          )"

          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "::error::requested version ${RELEASE_VERSION} does not match mix.exs version ${package_version}"
            exit 1
          fi

          if [ "$EXISTING_RELEASE" != "true" ]; then
            MIX_ENV=test mix ecto.create
            MIX_ENV=test mix ecto.migrate
            mix precommit
          fi

          mix hex.publish --dry-run --yes
          mix hex.build --unpack --output /tmp/aludel-hex-package

      - name: Commit release metadata
        if: ${{ steps.release_state.outputs.existing_release != 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.exs README.md CHANGELOG.md

          if git diff --cached --quiet; then
            echo "::error::release metadata did not change"
            exit 1
          fi

          git commit \
            -m "chore: release ${RELEASE_VERSION}" \
            -m "Update Aludel package metadata and changelog for ${RELEASE_VERSION}."

      - name: Tag and push release
        if: ${{ steps.release_state.outputs.existing_release != 'true' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git tag -a "v${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
          git push --atomic origin HEAD:main "v${RELEASE_VERSION}"

      - name: Create GitHub release
        if: ${{ steps.release_state.outputs.existing_release != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --notes-file /tmp/aludel-release-notes.md

      - name: Publish package
        env:
          HEX_API_KEY: ${{ secrets.HEX_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::error::HEX_SECRET_KEY is not configured"
            exit 1
          fi

          mix hex.publish --yes
